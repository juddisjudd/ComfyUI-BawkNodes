[project]
name = "comfyui-bawknodes"
version = "3.0.0"
description = "Compact FLUX.1 / FLUX.2 workflow nodes for ComfyUI: model loader (safetensors + GGUF), switchable LoRA sets, wildcard encoder, all-in-one sampler and organized image saver."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "judd" }]
keywords = ["comfyui", "flux", "flux2", "klein", "kontext", "lora", "gguf", "bawk"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/juddisjudd/ComfyUI-BawkNodes"
Issues = "https://github.com/juddisjudd/ComfyUI-BawkNodes/issues"

[tool.comfy]
PublisherId = "judd"
DisplayName = "Bawk Nodes Collection"
Icon = "https://raw.githubusercontent.com/juddisjudd/ComfyUI-BawkNodes/refs/heads/main/branding/bawknodes.png"
